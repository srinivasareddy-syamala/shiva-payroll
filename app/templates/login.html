{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-10 bg-white rounded-3xl shadow-xl overflow-hidden border border-blue-100">
  <div class="bg-gradient-to-br from-blue-950 via-blue-900 to-blue-700 px-8 pt-8 pb-14 text-center">
    <h1 class="text-2xl font-bold text-white">{{ company_name }}</h1>
    <p class="text-blue-200 text-sm">Salary &amp; Attendance</p>
  </div>
  <div class="-mt-12 flex justify-center">
    <img src="{{ url_for('static', filename='logo.png') }}" alt="{{ company_name }}"
         class="w-28 h-28 rounded-full bg-white shadow-lg ring-4 ring-white object-cover">
  </div>
  <form method="post" class="space-y-4 px-8 pb-8 pt-4">
    <div>
      <label class="block text-sm font-medium mb-1">Username</label>
      <input name="username" required autofocus class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Password</label>
      <input name="password" type="password" required class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
    </div>
    <button class="w-full bg-blue-700 hover:bg-blue-800 text-white rounded-lg py-2.5 font-semibold shadow">Login</button>
  </form>
</div>
{% endblock %}
