# Shiva Agrovet Payroll - PostgreSQL + app
# Secrets are NOT stored here. They come from environment variables:
#   - on your PC: a file named .env next to this file (see .env.example; never commit it)
#   - on Dokploy: the app's "Environment" tab (Dokploy writes them to .env)
# Start: docker compose up -d --build      Stop: docker compose down
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env / Dokploy Environment}
      POSTGRES_DB: ${POSTGRES_DB:-shiva_payroll}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env / Dokploy Environment}
      POSTGRES_DB: ${POSTGRES_DB:-shiva_payroll}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env / Dokploy Environment}
      COMPANY_NAME: ${COMPANY_NAME:-Shiva Agrovet}
      COMPANY_ADDRESS: ${COMPANY_ADDRESS:-}
      ADMIN_USER: ${ADMIN_USER:-admin}           # first owner login, created only if no owner exists
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}         # leave empty once an owner exists
      TZ: IST-5:30
      UPLOAD_FOLDER: /app/uploads
    volumes:
      - uploads:/app/uploads
    ports:
      - "${WEB_PORT:-5000}:5000"

volumes:
  pgdata:
  uploads:
